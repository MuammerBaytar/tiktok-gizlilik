<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>60 Saniyede Bir Konu - YouTube</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f0f;color:#fff;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center}
.k{padding:24px;max-width:360px}
a.b{display:block;margin:20px 0 12px;padding:16px;border-radius:12px;background:#ff0033;color:#fff;font-size:18px;font-weight:600;text-decoration:none}
a.y{color:#aaa;font-size:14px}
p{color:#ccc;line-height:1.5}
</style></head><body><div class="k">
<h1>60 Saniyede Bir Konu</h1>
<p>YouTube uygulaması açılıyor...</p>
<a class="b" id="ac" href="https://www.youtube.com/@60saniyedebirkonu">YouTube uygulamasında aç</a>
<a class="y" href="https://www.youtube.com/@60saniyedebirkonu">Tarayıcıda devam et</a>
</div>
<script>
var web="https://www.youtube.com/@60saniyedebirkonu";
var ua=navigator.userAgent||"";
var hedef=web;
if(/android/i.test(ua)){
  hedef="intent://www.youtube.com/@60saniyedebirkonu#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url="+encodeURIComponent(web)+";end";
}else if(/iphone|ipad|ipod/i.test(ua)){
  hedef="youtube://www.youtube.com/@60saniyedebirkonu";
}
document.getElementById("ac").href=hedef;
if(hedef!==web){
  window.location.href=hedef;
  setTimeout(function(){ if(!document.hidden){ window.location.href=web; } },2500);
}else{
  window.location.replace(web);
}
</script>
</body></html>
